; p350d: mitigation for the PHP session upload progress vulnerabilities
; (CVE-2026-109619, CVE-2026-115560). The web UI uses neither sessions nor
; file uploads, so the feature is not needed. Must be set here, at server
; level, not with ini_set() or .user.ini; restart php7.4-fpm after changes.
session.upload_progress.enabled = 0
